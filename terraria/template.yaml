# yaml-language-server: $schema=../.schema/gametemplate.schema.json
# Gameplane GameTemplate for Terraria (vanilla + tModLoader).
#
# Backed by passivelemon/terraria-docker. Vanilla vs tModLoader (and the
# build) is chosen in the New Server wizard from spec.versions — the choice
# maps to an image TAG (there is no VERSION env for Terraria). The server
# installs/extracts on first boot and logs to stdout, so the install output
# streams to the dashboard's Logs tab (source "pod"); there is no persistent
# logfile. No RCON — the Console tab attaches to container stdin (pty).
#
# Cluster-scoped; apply once per cluster:
#     kubectl apply -f modules/terraria/template.yaml

apiVersion: gameplane.local/v1alpha1
kind: GameTemplate
metadata:
  name: terraria
  labels:
    gameplane.local/module: terraria
spec:
  displayName: Terraria
  game: terraria
  # Kept in lockstep with module.yaml's bundle version from 2.1.0 onward.
  version: 2.2.3
  categories: [Sandbox, Survival, Adventure, Modded]
  # Brand color the dashboard tints this game's icon/accents with.
  accentColor: "#4a90d9"
  description: |
    Terraria + tModLoader dedicated server using
    [passivelemon/terraria-docker](https://github.com/PassiveLemon/terraria-docker).
    Choose vanilla or tModLoader (and the build) in the wizard — the choice
    maps to an image tag. tModLoader modpacks are managed from the Mods tab.
    Console attaches to container stdin (pty); no RCON.

  # Fallback image when a server selects no version. versions[] below is the
  # authoritative source for the wizard's picker.
  image: passivelemon/terraria-docker:terraria-latest@sha256:d60f280522d6c71079638b5036bdd6c4ac9f93c9f3250477ddb345fc2c6933f3

  # passivelemon's tModLoader scripts exit when MODPACK is blank or its
  # ModPacks/<pack>/Mods/enabled.json is missing. On tModLoader images
  # (GP_LOADER=tmodloader) a blank MODPACK selects a built-in empty "vanilla"
  # pack, created on first start and never overwritten. The image runs the
  # game in a detached tmux session that never reads container stdin, so the
  # wrapper also bridges the console: each line from the pty is sent to the
  # game with tmux send-keys (as the game user), and SIGTERM is forwarded to
  # the entrypoint so its save-and-exit trap still runs.
  command: ["/bin/sh", "-c"]
  args:
    - |
      pid=
      trap 'if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null; else exit 143; fi' TERM
      if [ "${GP_LOADER:-}" = "tmodloader" ]; then
        : "${MODPACK:=vanilla}"; export MODPACK
        if [ "$MODPACK" = "vanilla" ]; then
          mkdir -p /opt/terraria/config/ModPacks/vanilla/Mods
          [ -e /opt/terraria/config/ModPacks/vanilla/Mods/enabled.json ] || printf '[]\n' > /opt/terraria/config/ModPacks/vanilla/Mods/enabled.json
        fi
      fi
      /opt/terraria/entrypoint.sh &
      pid=$!
      rpid=
      if [ -t 0 ]; then
        exec 3<&0
        (
          cr=$(printf '\r')
          as=
          if [ "$(id -u)" = 0 ]; then
            if command -v gosu >/dev/null 2>&1; then as="gosu"; else as="su-exec"; fi
            as="$as ${PUID:-1000}:${PGID:-1000}"
          fi
          while :; do
            while IFS= read -r line <&3; do
              line=${line%"$cr"}
              [ -n "$line" ] || continue
              if ! { $as /usr/bin/tmux send-keys -l -- "$line" && $as /usr/bin/tmux send-keys Enter; } 2>/dev/null; then
                echo "[gameplane] console not ready; input ignored"
              fi
            done
            sleep 1
          done
        ) &
        rpid=$!
      fi
      while :; do
        wait "$pid"; rc=$?
        kill -0 "$pid" 2>/dev/null || break
      done
      [ -z "$rpid" ] || kill "$rpid" 2>/dev/null
      exit "$rc"

  ports:
    - name: game
      containerPort: 7777
      protocol: TCP
      advertise: true
      wakeProtocol: terraria

  storage:
    size: 4Gi
    mountPath: /opt/terraria/config

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  security:
    fsGroup: 1000

  # Terraria's command interface is the container stdin (no RCON), so the
  # Console tab attaches via the kubelet's pod-attach API.
  rcon:
    protocol: none
  consoleMode: pty

  # Version catalog. For Terraria the version IS the image tag (vanilla vs
  # tModLoader and the build). tModLoader entries carry the "tmodloader"
  # loader, which keys into capabilities.mods.loaders for the ModPacks
  # volume; vanilla has no loader, so vanilla servers show no Mods tab.
  versions:
    - id: vanilla-latest
      displayName: "Vanilla · latest"
      image: passivelemon/terraria-docker:terraria-latest@sha256:d60f280522d6c71079638b5036bdd6c4ac9f93c9f3250477ddb345fc2c6933f3
      loader: vanilla
      default: true
    - id: tmodloader-latest
      displayName: "tModLoader · latest"
      image: passivelemon/terraria-docker:tmodloader-latest@sha256:3f2d8703421159f1037084bd2c0901a3a63b85a00801cf36f6f928e8b666b44e
      loader: tmodloader
      env:
        - name: GP_LOADER
          value: tmodloader
    # Year channel: follows tModLoader's 2026.x stable line without jumping
    # to the next yearly major — steadier for servers with version-sensitive
    # mod sets than the plain latest tag.
    - id: tmodloader-2026
      displayName: "tModLoader · 2026 stable"
      image: passivelemon/terraria-docker:tmodloader-2026@sha256:3f2d8703421159f1037084bd2c0901a3a63b85a00801cf36f6f928e8b666b44e
      loader: tmodloader
      env:
        - name: GP_LOADER
          value: tmodloader
    - id: tmodloader-preview
      displayName: "tModLoader · latest preview"
      image: passivelemon/terraria-docker:tmodloader-latest-pre  # gameplane:floating
      loader: tmodloader
      env:
        - name: GP_LOADER
          value: tmodloader

  probes:
    readiness:
      # Ready once the server LISTENs on 7777 (0x1E61 in /proc/net/tcp). Never
      # tcpSocket: the kubelet's connect-and-close crashes the server
      # (ObjectDisposedException in Netplay.ServerLoop) and crash-loops the pod.
      exec:
        command: ["sh", "-c", "grep -qsE ':1E61 [0-9A-F]+:[0-9A-F]{4} 0A' /proc/net/tcp /proc/net/tcp6"]
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30

  capabilities:
    lifecycle:
      stop: ["exit"]
    # Terraria has no RCON (rcon.protocol: none above), so every action
    # below runs over stdin pod-attach instead of RCON — fire-and-forget:
    # no output returns inline, it appears in the Console tab. transport:
    # stdin is set explicitly on each action for clarity, even though it's
    # also what the default resolves to for this template.
    #
    # Terraria's dedicated-server console has no weather command, so there
    # is no set-weather action here (unlike minecraft-java/project-zomboid).
    actions:
      - id: broadcast
        displayName: Broadcast message
        group: Server
        icon: megaphone
        transport: stdin
        command: "say {{.Params.message}}"
        params:
          - name: message
            displayName: Message
            type: string
            required: true
      - id: save-world
        displayName: Save world
        group: World
        icon: save
        transport: stdin
        command: "save"
      - id: set-time
        displayName: Set time
        group: World
        icon: clock
        transport: stdin
        # The command IS the word: dawn/noon/dusk/midnight are each their
        # own console command on Terraria's server console (not a command
        # that takes a time-of-day argument), so the template is just the
        # param itself.
        command: "{{.Params.time}}"
        params:
          - name: time
            displayName: Time of day
            type: enum
            enum: ["dawn", "noon", "dusk", "midnight"]
            default: noon
            required: true
      - id: settle-water
        displayName: Settle water
        description: Settle all flowing liquids.
        group: World
        transport: stdin
        command: "settle"
      - id: set-motd
        displayName: Set MOTD
        group: Server
        transport: stdin
        command: "motd {{.Params.message}}"
        params:
          - name: message
            displayName: Message
            type: string
            required: true
      - id: kick-player
        displayName: Kick player
        description: Disconnect a player from the server.
        icon: user-minus
        group: Players
        transport: stdin
        command: "kick {{.Params.player}}"
        params:
          - name: player
            displayName: Player name
            type: string
            required: true
      - id: ban-player
        displayName: Ban player
        description: Disconnect and ban a player.
        icon: ban
        group: Players
        danger: true
        confirm: true
        transport: stdin
        command: "ban {{.Params.player}}"
        params:
          - name: player
            displayName: Player name
            type: string
            required: true
    # tModLoader modpacks live under <config>/ModPacks; the active modpack is
    # picked with the MODPACK config field. Vanilla has no loaders entry, so
    # vanilla servers show no Mods tab.
    mods:
      loaders:
        tmodloader:
          displayName: tModLoader ModPacks
          path: ModPacks
          extensions: [".zip", ".tmod"]
      install:
        allowedHosts:
          - github.com
          - .githubusercontent.com
        maxSizeMB: 512

  # Field names match passivelemon/terraria-docker env vars exactly.
  configSchema:
    - name: WORLDNAME
      displayName: World name
      type: string
      default: "Gameplane"
      required: true
    - name: AUTOCREATE
      displayName: World size
      description: World size to generate if the world doesn't exist. 1 small, 2 medium, 3 large.
      type: enum
      enum: ["1", "2", "3"]
      default: "2"
    - name: DIFFICULTY
      displayName: Difficulty
      description: "0 classic, 1 expert, 2 master, 3 journey."
      type: enum
      enum: ["0", "1", "2", "3"]
      default: "1"
    - name: PASSWORD
      displayName: Server password
      description: Leave blank for an open server.
      type: password
      default: ""
    - name: MAXPLAYERS
      displayName: Max players
      type: int
      default: "8"
    - name: MOTD
      displayName: MOTD
      type: string
      default: "Welcome to a Gameplane-hosted Terraria server"
    - name: SEED
      displayName: World seed
      description: Used when a new world is generated. Leave blank for random.
      type: string
      default: ""
    - name: SECURE
      displayName: Cheat protection
      type: enum
      enum: ["0", "1"]
      default: "1"
    - name: LANGUAGE
      displayName: Language
      type: enum
      enum: ["en-US", "de-DE", "es-ES", "fr-FR", "it-IT", "ja-JP", "pl-PL", "pt-BR", "ru-RU", "zh-Hans"]
      default: "en-US"
    - name: MODPACK
      displayName: Active modpack
      description: tModLoader only — a modpack folder name under ModPacks. Leave blank for the built-in empty "vanilla" pack.
      type: string
      default: ""
