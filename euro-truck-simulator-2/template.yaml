# yaml-language-server: $schema=../.schema/gametemplate.schema.json
# Gameplane GameTemplate for Euro Truck Simulator 2 (dedicated server).
#
# Backed by Gameplane-owned ETS2 container (SteamCMD base) that installs the
# dedicated server into the volume at start, with non-crashing diagnostic idle
# when the server logon token is missing (FR-013).
#
# Cluster-scoped; apply once per cluster:
#     kubectl apply -f modules/euro-truck-simulator-2/template.yaml

apiVersion: gameplane.local/v1alpha1
kind: GameTemplate
metadata:
  name: euro-truck-simulator-2
  labels:
    gameplane.local/module: euro-truck-simulator-2
spec:
  displayName: Euro Truck Simulator 2
  game: euro-truck-simulator-2
  version: 1.0.0
  categories: [Simulation, Driving, Multiplayer]
  accentColor: "#3b82f6"
  description: |
    Euro Truck Simulator 2 dedicated convoy server. Interactive console
    connects via container PTY stdin/stdout. The dedicated server (Steam app
    1948160) is installed into the `/data` volume at start; the convoy profile
    persists under `/data/profile`.

  image: ghcr.io/gameplanepanel/gameplane/euro-truck-simulator-2:latest@sha256:3296f2b444b1924933256e7e965ab96ba737c514542064db6a634759869e5e6d

  env:
    - name: GP_DATA_DIR
      value: /data

  security:
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000

  ports:
    - name: game
      containerPort: 27015
      protocol: UDP
      advertise: true
    - name: query
      containerPort: 27016
      protocol: UDP
      advertise: true

  storage:
    size: 10Gi
    mountPath: /data

  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 4Gi}

  rcon:
    protocol: none

  consoleMode: pty

  probes:
    startup:
      # Ready once the game UDP socket is bound (27015 = 0x6987, state 07).
      # First start downloads the server through SteamCMD, so allow ~30 min.
      # The entrypoint touches /tmp/gp-diagnostic-idle while idling without a
      # logon token (FR-013) so the accepted idle is not restarted. Readiness
      # below does not accept the marker: an idle pod is never Ready.
      exec:
        command: ["sh", "-c", "[ -f /tmp/gp-diagnostic-idle ] || grep -qsE ':6987 [0-9A-F:]+ 07' /proc/net/udp /proc/net/udp6"]
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 120
    readiness:
      exec:
        command: ["sh", "-c", "grep -qsE ':6987 [0-9A-F:]+ 07' /proc/net/udp /proc/net/udp6"]
      periodSeconds: 10
      failureThreshold: 6

  capabilities:
    lifecycle:
      stop: ["exit"]

  configSchema:
    - name: SERVER_LOGON_TOKEN
      displayName: Server Logon Token
      description: Steam Game Server Logon Token for ETS2 (App ID 227300) from steamcommunity.com/dev/managegameservers.
      type: password
      required: true
      default: ""
    - name: SERVER_NAME
      displayName: Convoy Name
      type: string
      default: "Gameplane ETS2 Convoy"
    - name: MAX_PLAYERS
      displayName: Max Players
      type: int
      default: 8
    - name: SERVER_PASSWORD
      displayName: Convoy Password
      description: Optional password required for clients to join.
      type: password
      default: ""
