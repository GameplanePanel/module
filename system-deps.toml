# System dependencies for modules (spec 026). Language libraries stay in go.mod/package.json.

component = "modules"

[[dep]]
name = "go"
kind = "toolchain"
version = "go"
reason = "make module-validate builds bin/gp-module with go and validates every module offline (Makefile:383-391; inventory 6(a))."

[[dep]]
name = "oras"
kind = "cli"
version = "oras"
reason = "modules/build.sh push needs oras >= 1.2.0 (modules/build.sh:19, :105, :170); make modules-push at Makefile:472-473."

[[dep]]
name = "pyyaml"
kind = "os-package"
reason = "modules/validate.py imports yaml (validate.py:103-109); installed as the python3-yaml apt package (setup.sh step_pyyaml)."
