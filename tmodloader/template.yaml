# yaml-language-server: $schema=../.schema/gametemplate.schema.json
# Gameplane GameTemplate for tModLoader (dedicated server).
#
# Backed by passivelemon/terraria-docker:tmodloader-latest. Dedicated server
# running the tModLoader .NET 6 modding framework for Terraria. Console
# attaches to container stdin (pty); no RCON. A blank MODPACK starts the
# built-in empty "vanilla" modpack (see the command wrapper below).
#
# Cluster-scoped; apply once per cluster:
#     kubectl apply -f modules/tmodloader/template.yaml

apiVersion: gameplane.local/v1alpha1
kind: GameTemplate
metadata:
  name: tmodloader
  labels:
    gameplane.local/module: tmodloader
spec:
  displayName: tModLoader
  game: tmodloader
  version: 1.0.2
  categories: [Sandbox, Survival, Adventure, Modded]
  accentColor: "#10b981"
  description: |
    tModLoader dedicated server for modded Terraria. Supports custom `.tmod`
    mods and modpacks with interactive console via container stdin (PTY).

  image: passivelemon/terraria-docker:tmodloader-latest@sha256:3f2d8703421159f1037084bd2c0901a3a63b85a00801cf36f6f928e8b666b44e

  env:
    - name: GP_LOADER
      value: tmodloader

  # passivelemon's tModLoader scripts exit when MODPACK is blank or its
  # ModPacks/<pack>/Mods/enabled.json is missing. On tModLoader images
  # (GP_LOADER=tmodloader) a blank MODPACK selects a built-in empty "vanilla"
  # pack, created on first start and never overwritten. The image runs the
  # game in a detached tmux session that never reads container stdin, so the
  # wrapper also bridges the console: each line from the pty is sent to the
  # game with tmux send-keys (as the game user), and SIGTERM is forwarded to
  # the entrypoint so its save-and-exit trap still runs.
  command: ["/bin/sh", "-c"]
  args:
    - |
      pid=
      trap 'if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null; else exit 143; fi' TERM
      if [ "${GP_LOADER:-}" = "tmodloader" ]; then
        : "${MODPACK:=vanilla}"; export MODPACK
        if [ "$MODPACK" = "vanilla" ]; then
          mkdir -p /opt/terraria/config/ModPacks/vanilla/Mods
          [ -e /opt/terraria/config/ModPacks/vanilla/Mods/enabled.json ] || printf '[]\n' > /opt/terraria/config/ModPacks/vanilla/Mods/enabled.json
        fi
      fi
      /opt/terraria/entrypoint.sh &
      pid=$!
      rpid=
      if [ -t 0 ]; then
        exec 3<&0
        (
          cr=$(printf '\r')
          as=
          if [ "$(id -u)" = 0 ]; then
            if command -v gosu >/dev/null 2>&1; then as="gosu"; else as="su-exec"; fi
            as="$as ${PUID:-1000}:${PGID:-1000}"
          fi
          while :; do
            while IFS= read -r line <&3; do
              line=${line%"$cr"}
              [ -n "$line" ] || continue
              if ! { $as /usr/bin/tmux send-keys -l -- "$line" && $as /usr/bin/tmux send-keys Enter; } 2>/dev/null; then
                echo "[gameplane] console not ready; input ignored"
              fi
            done
            sleep 1
          done
        ) &
        rpid=$!
      fi
      while :; do
        wait "$pid"; rc=$?
        kill -0 "$pid" 2>/dev/null || break
      done
      [ -z "$rpid" ] || kill "$rpid" 2>/dev/null
      exit "$rc"

  security:
    fsGroup: 1000

  ports:
    - name: game
      containerPort: 7777
      protocol: TCP
      advertise: true
      wakeProtocol: terraria

  storage:
    size: 4Gi
    mountPath: /opt/terraria/config

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  rcon:
    protocol: none

  consoleMode: pty

  probes:
    readiness:
      # Ready once the server LISTENs on 7777 (0x1E61 in /proc/net/tcp). Never
      # tcpSocket: the kubelet's connect-and-close crashes the server
      # (ObjectDisposedException in Netplay.ServerLoop) and crash-loops the pod.
      exec:
        command: ["sh", "-c", "grep -qsE ':1E61 [0-9A-F]+:[0-9A-F]{4} 0A' /proc/net/tcp /proc/net/tcp6"]
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30

  capabilities:
    lifecycle:
      stop: ["exit"]
    actions:
      - id: broadcast
        displayName: Broadcast message
        icon: megaphone
        transport: stdin
        command: "say {{.Params.message}}"
        params:
          - name: message
            displayName: Message
            type: string
            required: true
      - id: save-world
        displayName: Save world
        icon: save
        transport: stdin
        command: "save"
    mods:
      path: ModPacks/vanilla/Mods
      extensions: [".tmod", ".zip"]
      install:
        allowedHosts:
          - github.com
          - .githubusercontent.com
        maxSizeMB: 512

  configSchema:
    - name: WORLDNAME
      displayName: World name
      type: string
      default: "tModLoaderWorld"
      required: true
    - name: AUTOCREATE
      displayName: World size
      description: World size to generate if the world doesn't exist. 1 small, 2 medium, 3 large.
      type: enum
      enum: ["1", "2", "3"]
      default: "2"
    - name: DIFFICULTY
      displayName: Difficulty
      description: "0 classic, 1 expert, 2 master, 3 journey."
      type: enum
      enum: ["0", "1", "2", "3"]
      default: "1"
    - name: PASSWORD
      displayName: Server password
      type: password
      default: ""
    - name: MAXPLAYERS
      displayName: Max players
      type: int
      default: "8"
    - name: MOTD
      displayName: MOTD
      type: string
      default: "Welcome to Gameplane tModLoader Server"
    - name: MODPACK
      displayName: Active modpack
      description: Active modpack folder name under ModPacks. Leave blank for the built-in empty "vanilla" pack.
      type: string
      default: ""
