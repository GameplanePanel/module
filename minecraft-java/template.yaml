  # Console commands behind agent features. The agent interprets these at
  # runtime — moderation templates render with .Player/.Reason; the quiesce
  # sequences run around backup snapshots.
  capabilities:
    players:
      kick: "kick {{.Player}}{{if .Reason}} {{.Reason}}{{end}}"
      ban: "ban {{.Player}}{{if .Reason}} {{.Reason}}{{end}}"
      unban: "pardon {{.Player}}"
      banList:
        command: "banlist players"
        entryRegex: '^\s*(?P<name>[A-Za-z0-9_]{1,32})\s+was banned by\s+(?P<source>[^:]+?)(?::\s*(?P<reason>.*))?\s*$'
      whitelist:
        list: "whitelist list"
        add: "whitelist add {{.Player}}"
        remove: "whitelist remove {{.Player}}"
        # "There are 2 whitelisted player(s): alice, bob" — capture the
        # comma-separated tail; "no whitelisted players" yields no match.
        listRegex: 'whitelisted player[s()]*:\s*(?P<names>.+)$'
    quiesce:
      quiesce: ["save-off", "save-all flush"]
      unquiesce: ["save-on"]
      failurePattern: "saving failed"
    # Graceful stop: the operator issues these over RCON, waits for the
    # server to save and go down, then scales the pod to zero — so a SIGTERM
    # never interrupts an in-progress world save.
    lifecycle:
      stop: ["stop"]
    actions:
      - id: broadcast
        displayName: Broadcast message
        description: Send a chat message to everyone on the server.
        icon: megaphone
        group: Server
        command: "say {{.Params.message}}"
        params:
          - name: message
            displayName: Message
            type: string
            required: true
      - id: set-time
        displayName: Set time
        icon: clock
        group: World
        command: "time set {{.Params.time}}"
        params:
          - name: time
            displayName: Time of day
            type: enum
            enum: ["day", "noon", "night", "midnight"]
            default: day
      - id: set-weather
        displayName: Set weather
        icon: cloud
        group: World
        command: "weather {{.Params.weather}}"
        params:
          - name: weather
            displayName: Weather
            type: enum
            enum: ["clear", "rain", "thunder"]
            default: clear
      - id: set-difficulty
        displayName: Set difficulty
        icon: settings
        group: World
        command: "difficulty {{.Params.level}}"
        params:
          - name: level
            displayName: Difficulty
            type: enum
            enum: ["peaceful", "easy", "normal", "hard"]
            default: normal
            required: true
            currentFrom: difficulty
      # whitelist-add / whitelist-remove were removed here — whitelist
      # management now lives solely on the Players tab
      # (capabilities.players.whitelist above), so quick actions don't
      # duplicate that UI.
      - id: save-world
        displayName: Save world
        description: Flush the world to disk now.
        icon: save
        group: World
        command: "save-all flush"
      - id: announce-restart
        displayName: Announce restart
        description: Warn players, save the world, then stop the server.
        icon: rotate-ccw
        group: Server
        danger: true
        confirm: true
        commands:
          - 'say {{.Params.message}}'
          - "save-all flush"
          - "stop"
        params:
          - name: message
            displayName: Message
            type: string
            default: "Server restarting shortly — please log out safely."
            required: true
      - id: give-item
        displayName: Give item
        description: Grant an item to a player.
        icon: gift
        group: Players
        command: "give {{.Params.player}} {{.Params.item}} {{.Params.count}}"
        params:
          - name: player
            displayName: Player name
            type: string
            required: true
          - name: item
            displayName: Item ID (e.g. diamond, golden_apple)
            type: string
            required: true
          - name: count
            displayName: Quantity
            type: int
            default: "1"
            required: true
      - id: set-gamemode
        displayName: Set player game mode
        description: Change one player's game mode.
        icon: gamepad-2
        group: Players
        command: "gamemode {{.Params.mode}} {{.Params.player}}"
        params:
          - name: mode
            displayName: Game mode
            type: enum
            enum: ["survival", "creative", "adventure", "spectator"]
            default: survival
            required: true
          - name: player
            displayName: Player name
            type: string
            required: true
      - id: toggle-daylight-cycle
        displayName: Toggle daylight cycle
        description: Freeze or resume the day/night cycle.
        icon: sun
        group: World
        command: "gamerule doDaylightCycle {{.Params.value}}"
        params:
          - name: value
            displayName: Daylight cycle
            type: enum
            enum: ["true", "false"]
            default: "true"
            required: true
      - id: toggle-keep-inventory
        displayName: Toggle keep inventory
        description: Whether players keep their items on death.
        icon: backpack
        group: World
        command: "gamerule keepInventory {{.Params.value}}"
        params:
          - name: value
            displayName: Keep inventory
            type: enum
            enum: ["true", "false"]
            default: "false"
            required: true
    status:
      metrics:
        - id: seed
          displayName: World seed
          command: "seed"
          regex: 'Seed: \[(?P<value>-?\d+)\]'
        - id: difficulty
          displayName: Difficulty
          command: "difficulty"
          regex: 'The difficulty is (?P<value>\w+)'
    # Per-(version+loader) mod volumes. The active version's loader selects
    # which directory the dashboard's Mods tab manages and which volume the
    # operator provisions+mounts. Bukkit-family loaders use plugins/; mod
    # loaders use mods/. Vanilla has no entry, so vanilla servers show no
    # Mods tab.
    mods:
      loaders:
        paper:  { displayName: Plugins (Paper),  path: plugins, extensions: [".jar"] }
        spigot: { displayName: Plugins (Spigot), path: plugins, extensions: [".jar"] }
        bukkit: { displayName: Plugins (Bukkit), path: plugins, extensions: [".jar"] }
        purpur: { displayName: Plugins (Purpur), path: plugins, extensions: [".jar"] }
        forge:  { displayName: Mods (Forge),     path: mods,    extensions: [".jar"] }
        neoforge: { displayName: Mods (NeoForge), path: mods,   extensions: [".jar"] }
        fabric: { displayName: Mods (Fabric),    path: mods,    extensions: [".jar"] }
        quilt:  { displayName: Mods (Quilt),     path: mods,    extensions: [".jar"] }
      install:
        allowedHosts:
          - cdn.modrinth.com
          - .modrinth.com
          - .curseforge.com
          - .forgecdn.net
          - hangarcdn.papermc.io
          - hangar.papermc.io
          - github.com
          - .githubusercontent.com
        maxSizeMB: 512
      # In-app browse: the Mods tab can search Modrinth for the active
      # loader + game version and one-click install (the chosen file
      # downloads via the allowlist above — cdn.modrinth.com is listed).
      # The loader id is used verbatim as a Modrinth category facet.
      # Multiple registries; the dashboard shows a provider switch. Modrinth
      # is the default. CurseForge needs an API key (admin config) and is
      # hidden until configured. Hangar serves Paper/Velocity plugins.
      registry:
        providers:
          - provider: modrinth
            # Modpacks tab: installing a Modrinth modpack pins it via the
            # itzg image's native env (TYPE=MODRINTH + MODRINTH_MODPACK=<slug>),
            # which installs the whole pack on boot. One modpack per server.
            modpacks:
              refEnv: MODRINTH_MODPACK
              env:
                - { name: TYPE, value: MODRINTH }
          - provider: curseforge
            # 432 is Minecraft's numeric CurseForge game id (verified
            # against CurseForge's own /v1/games).
            curseforgeGameID: 432
          - provider: hangar

  probes:
    readiness:
      exec:
        command: ["mc-health"]
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 20
    liveness:
      exec:
        command: ["mc-health"]
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 5
    startup:
      exec:
        command: ["mc-health"]
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 60

  # TYPE and VERSION are driven by the versions[] picker above, so they are
  # NOT config fields here (avoids asking twice / double-binding).
  configSchema:
    - name: DIFFICULTY
      displayName: Difficulty
      type: enum
      enum: ["peaceful", "easy", "normal", "hard"]
      default: easy

    - name: MODE
      displayName: Game mode
      type: enum
      enum: ["survival", "creative", "adventure", "spectator"]
      default: survival

    - name: MAX_PLAYERS
      displayName: Max players
      type: int
      default: "20"

    - name: MOTD
      displayName: MOTD
      description: Server description shown in the multiplayer list.
      type: string
      default: "A Gameplane Minecraft server"

    - name: LEVEL_SEED
      displayName: World seed
      description: Leave blank for a random seed.
      type: string
      default: ""

    # The config key stays WHITELIST_ENABLED so saved server values keep
    # working, but the itzg image only turns on white-list for
    # ENABLE_WHITELIST (it also sets enforce-whitelist with it).
    - name: WHITELIST_ENABLED
      displayName: Enforce whitelist
      type: bool
      default: "false"
      envName: ENABLE_WHITELIST

    - name: PVP
      displayName: PvP enabled
      type: bool
      default: "true"

    - name: HARDCORE
      displayName: Hardcore mode
      type: bool
      default: "false"

    - name: ONLINE_MODE
      displayName: Online mode
      description: Verify players with Mojang. Disable only for offline/LAN setups.
      type: bool
      default: "true"

    - name: VIEW_DISTANCE
      displayName: View distance (chunks)
      type: int
      default: "10"

    - name: MAX_MEMORY
      displayName: JVM max heap
      description: >-
        Heap ceiling, for example 2G or 65%. Leave empty for 75% of the
        container memory limit. Allow room for memory outside the Java heap.
      type: string
      applyOnRestart: true
      autoFromMemoryLimit:
        percent: 75

    - name: INIT_MEMORY
      displayName: JVM initial heap
      description: >-
        Starting heap, for example 512M or 37.5%. Leave empty for 75% of the
        container memory limit. Keep the initial heap at or below the maximum.
      type: string
      applyOnRestart: true
      autoFromMemoryLimit:
        percent: 75

    - name: JVM_OPTS
      displayName: Additional JVM options
      description: Space-separated Java options, for example -Dfile.encoding=UTF-8.
      type: string
      applyOnRestart: true

    - name: JVM_XX_OPTS
      displayName: Additional JVM tuning options
      description: Space-separated JVM tuning options, for example -XX:+PrintCommandLineFlags.
      type: string
      applyOnRestart: true

    - name: USE_AIKAR_FLAGS
      displayName: Use Aikar's flags
      description: Let the image select its Aikar garbage collection flags for this JVM and heap.
      type: bool
      default: "false"
      applyOnRestart: true
